<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento - Controle de Tanque</title>
    <link rel="icon" href="https://www3.unaerp.br/docente/resources/images/favicon-16x16.png" type="image/png">
    <style>
        /* Estilos Globais */
        :root {
            --primary-color: #008CBA;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #150857;
            margin-bottom: 5px;
        }

        .status-badge {
            background-color: #4CAF50;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        /* Container da Tabela */
        .table-container {
            width: 100%;
            max-width: 1000px;
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            text-align: left;
            padding: 15px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            font-size: 0.95em;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        /* Estilo para os Níveis */
        .level-badge {
            font-weight: bold;
            color: var(--primary-color);
        }

        .diff-negative { color: #e74c3c; }
        .diff-positive { color: #2ecc71; }

        /* Rodapé */
        .footer {
            margin-top: 40px;
            font-size: 0.8em;
            color: #888;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer img {
            opacity: 0.7;
        }

        /* Estado de Carregamento */
        .loading {
            text-align: center;
            padding: 40px;
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>Histórico de Operação</h1>
        <span class="status-badge" id="lastUpdate">Atualizando...</span>
    </header>

    <div class="table-container">
        <table id="logTable">
            <thead>
                <tr>
                    <th>Tanque</th>
                    <th>Data (Placa)</th>
                    <th>Data (Servidor)</th>
                    <th>Nível Ant.</th>
                    <th>Nível Atual</th>
                    <th>Variação</th>
                </tr>
            </thead>
            <tbody id="logBody">
                <tr>
                    <td colspan="6" class="loading">Buscando dados no servidor...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        <img src="https://raw.githubusercontent.com/BrBoy/website/main/industria.png" alt="logo" width="40">
        <span>SoftWare para Indústrias - Sistema de Monitoramento v2.0</span>
    </div>

    <script>
        // URL da sua nova API
        const API_URL = '/api/historico';

        async function fetchLogs() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Erro ao buscar dados');
                
                const data = await response.json();
                updateTable(data);
                
                const now = new Date().toLocaleTimeString();
                document.getElementById('lastUpdate').innerText = `Última atualização: ${now}`;
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('logBody').innerHTML = 
                    '<tr><td colspan="6" style="color:red; text-align:center;">Erro ao carregar dados do banco.</td></tr>';
            }
        }

        function updateTable(logs) {
            const body = document.getElementById('logBody');
            
            if (logs.length === 0) {
                body.innerHTML = '<tr><td colspan="6" style="text-align:center;">Nenhum log encontrado.</td></tr>';
                return;
            }

            body.innerHTML = logs.map(log => {
                const nivelAtual = parseFloat(log.nivel_atual);
                const nivelAnterior = log.nivel_anterior ? parseFloat(log.nivel_anterior) : nivelAtual;
                const diff = (nivelAtual - nivelAnterior).toFixed(2);
                const diffClass = diff < 0 ? 'diff-negative' : (diff > 0 ? 'diff-positive' : '');

                return `
                    <tr>
                        <td><strong>Tanque ${log.id_tanque}</strong></td>
                        <td>${log.data_placa}</td>
                        <td style="color: #888;">${log.data_servidor}</td>
                        <td>${log.nivel_anterior ? log.nivel_anterior + 'L' : '-'}</td>
                        <td class="level-badge">${log.nivel_atual}L</td>
                        <td class="${diffClass}">${diff > 0 ? '+' : ''}${diff}L</td>
                    </tr>
                `;
            }).join('');
        }

        // Inicia a busca e define intervalo de 10 segundos
        fetchLogs();
        setInterval(fetchLogs, 10000);
    </script>
</body>
</html>
